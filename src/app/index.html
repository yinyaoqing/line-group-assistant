<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群組助理設定</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb;
    --accent: #06c755; --accent-ink: #fff; --warn: #b45309; --danger: #dc2626; --chip: #eef0f3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111315; --card: #1b1e21; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3034; --chip: #262a2e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  main.wide { max-width: 1100px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--chip); border: 2px solid transparent; cursor: pointer; user-select: none; font-size: 14px; }
  .chip input { display: none; }
  .chip.on { border-color: var(--accent); }
  .chip.locked { opacity: .5; cursor: not-allowed; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .45; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg label { flex: 1; text-align: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .seg input { display: none; }
  .seg label.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  input[type=number], input[type=text], input[type=date], select, textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
  textarea { width: 100%; min-height: 96px; }
  .bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.hot { background: var(--warn); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.pro { background: #fef3c7; color: #92400e; }
  .muted { color: var(--muted); font-size: 13px; }
  .note { white-space: pre-line; color: var(--muted); font-size: 13px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--chip); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: center; }
  .savebar button { flex: 1; max-width: 608px; }
  .list a, .list button.item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 0; color: inherit; text-decoration: none; background: none; border-radius: 0; text-align: left; }
  .list > * + * { border-top: 1px solid var(--line); }
  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 10; max-width: calc(100% - 32px); white-space: pre-line; }
  .error { color: var(--danger); white-space: pre-line; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input, .field select { color: var(--text); }
  .back { background: none; padding: 0; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  code { font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<main id="app"><p class="muted">載入中 Loading…</p></main>
<div class="savebar" id="savebar" hidden><button class="primary" id="save">儲存 Save</button></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
"use strict";
const $app = document.getElementById("app");
const $savebar = document.getElementById("savebar");
const $save = document.getElementById("save");
let session = null;
let me = null;

// ---------- helpers ----------
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
};
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
function toast(msg) {
  const t = h("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session } : {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
  return data;
}
function fail(err) {
  $savebar.hidden = true;
  $app.replaceChildren(h("div", { class: "card" }, h("h2", {}, "無法開啟 Can't open"), h("p", { class: "error" }, err.message || String(err))));
}
const fmt = (n) => Number(n).toLocaleString("zh-TW");
const switchEl = (checked, disabled, onchange) => {
  const input = h("input", { type: "checkbox", checked, disabled, onchange: (e) => onchange(e.target.checked) });
  return h("label", { class: "switch" }, input, h("span"));
};

// ---------- sign-in ----------
async function signIn() {
  const config = await api("/api/config");
  const params = new URLSearchParams(location.search);
  const devSub = config.devMode ? params.get("dev") : null;
  let idToken = null;
  if (!devSub) {
    if (!config.liffId) throw new Error("設定頁尚未開通（LIFF_ID 未設定）\nThe settings page is not set up yet.");
    await liff.init({ liffId: config.liffId });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(() => {}); }
    idToken = liff.getIDToken();
  }
  // LIFF restores ?link=… into the URL during init.
  const link = new URLSearchParams(location.search).get("link");
  const cached = !link && store.get("session");
  if (cached) { session = cached; return { groupId: null }; }
  const res = await api("/api/session", { method: "POST", body: JSON.stringify({ idToken, link, devSub }) });
  session = res.session;
  store.set("session", session);
  if (link) {
    params.delete("link");
    history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : ""));
  }
  return res;
}

// ---------- views ----------
async function home() {
  $savebar.hidden = true;
  $app.classList.remove("wide");
  me = await api("/api/me");
  const tabs = me.platformAdmin ? h("div", { class: "tabs" },
    h("button", { class: "on" }, "我的群組"),
    h("button", { onclick: () => adminGroups().catch(fail) }, "所有群組"),
    h("button", { onclick: () => adminChannels().catch(fail) }, "白牌頻道")) : null;
  const list = me.groups.length
    ? h("div", { class: "list" }, me.groups.map((g) => h("button", { class: "item", onclick: () => groupPage(g.groupId).catch(fail) },
        h("span", {}, g.name || g.groupId, " ", g.role === "owner" ? "👑" : "🛡"),
        h("span", { class: g.plan === "pro" ? "badge pro" : "badge" }, g.plan === "pro" ? "Pro" : "Free"))))
    : h("p", { class: "muted" }, "還沒有可管理的群組。在群組輸入 /settings 開啟該群組的設定。\nNo groups yet — send /settings in a group.");
  $app.replaceChildren(
    h("h1", {}, "群組助理"),
    h("p", { class: "sub" }, me.name || "", " · 帳號 ID ", h("code", {}, me.sub)),
    tabs,
    h("div", { class: "card" }, h("h2", {}, "我管理的群組 My groups"), list),
  );
}

async function groupPage(groupId) {
  $app.classList.remove("wide");
  const g = await api("/api/groups/" + encodeURIComponent(groupId));
  const draft = {
    plugins: [...g.plugins],
    translate: { languages: [...g.translate.languages], trigger: g.translate.trigger, showName: g.translate.showName, minLength: g.translate.minLength, glossary: g.translate.glossary },
    tasks: { digest: g.tasks.digest },
  };
  const isPro = g.plan.id === "pro";
  const pct = g.usage.limit ? Math.min(100, Math.round((g.usage.translateChars / g.usage.limit) * 100)) : 0;

  const pluginRow = (name, label, desc) => h("div", { class: "row" },
    h("div", {}, label, h("small", {}, desc)),
    switchEl(draft.plugins.includes(name), false, (on) => {
      draft.plugins = on ? [...new Set([...draft.plugins, name])] : draft.plugins.filter((p) => p !== name);
    }));

  const langChips = h("div", { class: "chips" }, g.languages.map((l) => {
    const chip = h("label", { class: "chip" + (draft.translate.languages.includes(l.code) ? " on" : "") + (l.allowed ? "" : " locked") },
      h("input", { type: "checkbox" }), l.flag, " ", l.name, l.allowed ? null : " 🔒");
    chip.addEventListener("click", (e) => {
      e.preventDefault();
      if (!l.allowed) return toast("專業版才能使用這個語言\nAvailable on Pro");
      const on = draft.translate.languages.includes(l.code);
      draft.translate.languages = on ? draft.translate.languages.filter((c) => c !== l.code) : [...draft.translate.languages, l.code];
      chip.classList.toggle("on", !on);
    });
    return chip;
  }));

  const seg = h("div", { class: "seg" }, [["all", "每則 All"], ["command", "只翻 /t"]].map(([v, label]) => {
    const el = h("label", { class: draft.translate.trigger === v ? "on" : "" }, h("input", { type: "radio", name: "trigger" }), label);
    el.addEventListener("click", () => { draft.translate.trigger = v; seg.querySelectorAll("label").forEach((x) => x.classList.toggle("on", x === el)); });
    return el;
  }));

  const glossary = h("textarea", { placeholder: "收頭樑 = trimmer beam; 格柵 = joist" });
  glossary.value = g.translate.glossary;
  glossary.addEventListener("input", () => { draft.translate.glossary = glossary.value; });
  const minLen = h("input", { type: "number", min: 1, max: 50, value: draft.translate.minLength, style: "width:80px" });
  minLen.addEventListener("input", () => { draft.translate.minLength = Number(minLen.value); });

  $app.replaceChildren(
    me ? h("button", { class: "back", onclick: () => home().catch(fail) }, "‹ 我的群組") : null,
    h("h1", {}, g.name || "群組"),
    h("p", { class: "sub" }, h("span", { class: isPro ? "badge pro" : "badge" }, g.plan.name), g.plan.until ? " · 到期 " + g.plan.until : "", g.status !== "active" ? " · 未啟用" : ""),

    h("div", { class: "card" },
      h("h2", {}, "本月翻譯用量 Usage this month"),
      h("div", { class: "bar" }, h("i", { class: pct >= 90 ? "hot" : "", style: "width:" + pct + "%" })),
      h("div", { class: "muted" }, fmt(g.usage.translateChars), " / ", g.usage.limit ? fmt(g.usage.limit) + " 字元" : "不限", g.usage.limit ? "（" + pct + "%）" : "")),

    h("div", { class: "card" },
      h("h2", {}, "功能 Features"),
      pluginRow("translate", "🌐 自動翻譯 Translation", "群組訊息自動翻成其他語言"),
      pluginRow("tasks", "📋 任務 Tasks", "/add 新增、/todo 清單"),
      pluginRow("tools", "🔧 工具 Tools", "/tool 線鋸 1 累加、/tool 清單"),
      pluginRow("materials", "🧱 材料 Materials", "/material 螺絲 100 累加、/material 清單")),

    h("div", { class: "card" },
      h("h2", {}, "翻譯語言 Languages"),
      h("p", { class: "muted" }, "每則訊息會翻成其他勾選的語言（至少兩種）。"),
      langChips,
      h("div", { class: "row", style: "margin-top:12px" }, h("div", {}, "要翻譯哪些訊息", h("small", {}, "選「只翻 /t」時，自動翻譯關閉")), seg),
      h("div", { class: "row" }, h("div", {}, "顯示發言者名字", h("small", {}, "譯文前面加上名字")), switchEl(draft.translate.showName, false, (on) => { draft.translate.showName = on; })),
      h("div", { class: "row" }, h("div", {}, "最短翻譯長度", h("small", {}, "少於這個字數的訊息不翻（例如「OK」）")), minLen)),

    h("div", { class: "card" },
      h("h2", {}, "專有名詞 Glossary"),
      h("p", { class: "muted" }, "用分號分隔，例如「收頭樑 = trimmer beam」。", g.translate.engine === "claude" ? "" : "（目前的翻譯引擎是 " + g.translate.engine + "，詞彙表只有 Claude 引擎會使用）"),
      glossary),

    h("div", { class: "card" },
      h("h2", {}, "任務 Tasks"),
      h("div", { class: "row" }, h("div", {}, "每週一推播進度摘要", h("small", {}, isPro ? "會用到 LINE 推播額度" : "專業版功能 🔒")),
        switchEl(draft.tasks.digest, !isPro, (on) => { draft.tasks.digest = on; }))),

    h("div", { class: "card" },
      h("h2", {}, "匯出報表 Report"),
      h("p", { class: "muted" }, "任務與物品的統計、明細，可下載 CSV（Excel 可開）或列印成 PDF。連結 24 小時內有效。也可以在群組輸入 /report。"),
      h("button", { class: "primary", onclick: async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          const { url } = await api("/api/groups/" + encodeURIComponent(groupId) + "/report", { method: "POST" });
          if (window.liff && liff.isInClient && liff.isInClient()) liff.openWindow({ url, external: true });
          else window.open(url, "_blank", "noopener");
        } catch (err) { toast("⚠️ " + err.message); } finally { btn.disabled = false; }
      } }, "📊 開啟報表")),

    h("div", { class: "card" },
      h("h2", {}, "方案 Plan"),
      h("div", { class: "list" }, g.plans.map((p) => h("div", { class: "row" },
        h("div", {}, p.name, p.id === g.plan.id ? " ✓" : "", h("small", {}, fmt(p.monthlyChars), " 字/月 · ", p.languages.length, " 種語言", p.digest ? " · 每週摘要" : "")),
        h("span", {}, p.price ? "NT$" + p.price + "/月" : "免費")))),
      isPro ? null : h("p", { class: "note" }, g.upgradeNote)),

    h("div", { class: "card" },
      h("h2", {}, "管理員 Admins"),
      h("div", { class: "list" }, g.admins.map((a) => h("div", { class: "row" },
        h("span", {}, a.role === "owner" ? "👑 " : "🛡 ", a.name), h("span", { class: "muted" }, a.linked ? "已登入過" : "尚未登入")))),
      h("p", { class: "muted" }, "在群組輸入「/admin add @成員」新增管理員。")),
  );

  $savebar.hidden = false;
  $save.onclick = async () => {
    $save.disabled = true;
    try {
      await api("/api/groups/" + encodeURIComponent(groupId) + "/settings", { method: "PUT", body: JSON.stringify(draft) });
      toast("✅ 已儲存 Saved");
      await groupPage(groupId);
    } catch (err) {
      toast("⚠️ " + err.message);
    } finally {
      $save.disabled = false;
    }
  };
}

// ---------- platform admin ----------
function adminTabs(active) {
  $app.classList.add("wide");
  return h("div", { class: "tabs" },
    h("button", { onclick: () => home().catch(fail) }, "我的群組"),
    h("button", { class: active === "groups" ? "on" : "", onclick: () => adminGroups().catch(fail) }, "所有群組"),
    h("button", { class: active === "channels" ? "on" : "", onclick: () => adminChannels().catch(fail) }, "白牌頻道"));
}

async function adminGroups() {
  $savebar.hidden = true;
  const groups = await api("/api/admin/groups");
  const rows = groups.map((g) => {
    const plan = h("select", {}, ["free", "pro"].map((p) => h("option", { value: p, selected: g.planId === p }, p)));
    const until = h("input", { type: "date", value: g.planUntil || "" });
    const status = h("select", {}, ["active", "pending"].map((s) => h("option", { value: s, selected: g.status === s }, s)));
    const engine = h("select", {}, ["google", "deepl", "claude"].map((e) => h("option", { value: e, selected: g.engine === e }, e)));
    const quota = h("input", { type: "number", min: 0, placeholder: "方案預設", value: g.monthlyChars ?? "", style: "width:110px" });
    const save = h("button", { class: "primary", onclick: async () => {
      save.disabled = true;
      try {
        await api("/api/admin/groups/" + encodeURIComponent(g.groupId), { method: "PUT", body: JSON.stringify({
          plan: plan.value, planUntil: until.value, status: status.value, engine: engine.value, monthlyChars: quota.value === "" ? null : Number(quota.value) }) });
        toast("✅ 已更新 " + (g.name || g.groupId));
      } catch (err) { toast("⚠️ " + err.message); } finally { save.disabled = false; }
    } }, "更新");
    return h("tr", {},
      h("td", {}, h("button", { class: "back", style: "margin:0", onclick: () => groupPage(g.groupId).catch(fail) }, g.name || g.groupId.slice(0, 10)), h("br"), h("span", { class: "muted" }, g.channelId)),
      h("td", {}, status), h("td", {}, plan), h("td", {}, until), h("td", {}, engine), h("td", {}, quota),
      h("td", {}, fmt(g.translateChars), " / ", g.limit ? fmt(g.limit) : "∞"), h("td", {}, save));
  });
  $app.replaceChildren(
    h("h1", {}, "平台管理 Platform"),
    h("p", { class: "sub" }, "共 ", groups.length, " 個群組。收到款項後在這裡把方案改成 pro 並填到期日。"),
    adminTabs("groups"),
    h("div", { class: "card scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, ["群組", "狀態", "方案", "到期日", "引擎", "額度覆寫", "本月用量", ""].map((x) => h("th", {}, x)))),
      h("tbody", {}, rows))),
  );
}

async function adminChannels() {
  $savebar.hidden = true;
  const channels = await api("/api/admin/channels");
  const f = {
    channelId: h("input", { type: "text", placeholder: "acme-corp" }),
    name: h("input", { type: "text", placeholder: "客戶名稱" }),
    secret: h("input", { type: "text", placeholder: "Channel secret" }),
    token: h("input", { type: "text", placeholder: "Channel access token" }),
    joinPolicy: h("select", {}, h("option", { value: "open" }, "邀請即啟用 open"), h("option", { value: "code" }, "需要啟用碼 code")),
    activationCode: h("input", { type: "text", placeholder: "需要啟用碼時填" }),
  };
  const add = h("button", { class: "primary", onclick: async () => {
    add.disabled = true;
    try {
      const body = Object.fromEntries(Object.entries(f).map(([k, el]) => [k, el.value]));
      const res = await api("/api/admin/channels", { method: "POST", body: JSON.stringify(body) });
      toast("✅ 已儲存，Webhook URL：\n" + res.webhookUrl);
      await adminChannels();
    } catch (err) { toast("⚠️ " + err.message); } finally { add.disabled = false; }
  } }, "新增／更新頻道");
  $app.replaceChildren(
    h("h1", {}, "白牌頻道 Channels"),
    h("p", { class: "sub" }, "客戶自己的 LINE 官方帳號。把下方 Webhook URL 填進該帳號的 Messaging API 設定。"),
    adminTabs("channels"),
    h("div", { class: "card" }, h("h2", {}, "頻道列表"),
      channels.length ? h("div", { class: "list" }, channels.map((c) => h("div", { class: "row" },
        h("div", {}, c.name, " ", h("span", { class: "badge" }, c.joinPolicy), h("small", {}, h("code", {}, c.webhookUrl))),
        h("button", { onclick: async (e) => {
          const btn = e.currentTarget;
          if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "再按一次確認刪除"; return; }
          await api("/api/admin/channels/" + encodeURIComponent(c.channelId), { method: "DELETE" }).then(() => adminChannels()).catch((err) => toast("⚠️ " + err.message));
        } }, "刪除"))))
      : h("p", { class: "muted" }, "還沒有白牌頻道。")),
    h("div", { class: "card" }, h("h2", {}, "新增或更新"),
      h("div", { class: "grid2" },
        h("label", { class: "field" }, "代號（網址用，小寫英數）", f.channelId),
        h("label", { class: "field" }, "名稱", f.name),
        h("label", { class: "field" }, "Channel secret（更新時可留空）", f.secret),
        h("label", { class: "field" }, "Access token（更新時可留空）", f.token),
        h("label", { class: "field" }, "群組啟用方式", f.joinPolicy),
        h("label", { class: "field" }, "啟用碼", f.activationCode)),
      h("div", { style: "margin-top:12px" }, add)),
  );
}

// ---------- start ----------
(async () => {
  try {
    const res = await signIn();
    const target = res.groupId || new URLSearchParams(location.search).get("group");
    if (target) {
      me = await api("/api/me").catch(() => null);
      await groupPage(target);
    } else if (location.hash === "#admin") {
      await adminGroups();
    } else if (location.hash === "#channels") {
      await adminChannels();
    } else {
      await home();
    }
  } catch (err) {
    // A stale cached session: drop it and start over once.
    if (/重新登入|sign in/i.test(err.message) && store.get("session")) { store.set("session", ""); location.reload(); return; }
    fail(err);
  }
})();
</script>
</body>
</html>
