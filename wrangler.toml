name = "line-group-assistant"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The settings page (src/app/index.html) is bundled as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# The logo and icons (src/assets) are bundled as binary and served by the Worker.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# 每週一 08:00（台北時間）= 週一 00:00 UTC，用來推播每週摘要；
# 每天 09:00（台北時間）= 01:00 UTC，節日提醒。對應 config/crons.ts。
# Weekly digest: Monday 08:00 Taipei = Monday 00:00 UTC;
# festival reminders: daily 09:00 Taipei = 01:00 UTC. Mirrored in config/crons.ts.
[triggers]
crons = ["0 0 * * 1", "0 1 * * *"]

# 金鑰請用 `wrangler secret put <NAME>` 設定，不要寫在這裡：
# Set secrets with `wrangler secret put <NAME>`, never in this file:
#   LINE_CHANNEL_SECRET          (required)
#   LINE_CHANNEL_ACCESS_TOKEN    (required)
#   GOOGLE_SERVICE_ACCOUNT_JSON  (sheets storage)
#   GOOGLE_TRANSLATE_API_KEY     (translate engine "google")
#   DEEPL_API_KEY                (translate engine "deepl")
#   ANTHROPIC_API_KEY            (translate engine "claude")
#   APP_SECRET                   (signs settings links and sessions; encrypts white-label credentials)
#   PLATFORM_ADMINS              (comma-separated LINE Login user IDs allowed into the admin page)

# 設定頁（LIFF）：在 LINE Developers 建立 LINE Login channel 與 LIFF app 後填入。
# Settings page (LIFF): fill in after creating a LINE Login channel and LIFF app.
[vars]
LIFF_ID = "2012043075-FcoKHkDN"
LOGIN_CHANNEL_ID = "2012043075"

# 群組設定、外掛資料表、用量都存在 D1。建立：`wrangler d1 create line-group-assistant`，
# 套用資料表：`npm run db:migrate`。
# Groups, plugin tables and usage live in D1.
[[d1_databases]]
binding = "DB"
database_name = "line-group-assistant"
database_id = "f5e6fdd4-93b4-4e73-88de-89dce14000f6"
migrations_dir = "migrations"
